<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>말랑이의 공부 숲</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="공부 숲">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#D6F0FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 한 화면짜리 스티커북. 모든 조각은 굵은 잉크 테두리 + 아래로 떨어지는 딱딱한 그림자. */
:root{
  color-scheme: light;
  --sky:#D6F0FF;
  --meadow:#BDEBC8;
  --ink:#27364B;
  --paper:#FFFDF6;
  --ko:#FF7FA3;
  --en:#4AA8F0;
  --ma:#FFB627;
  --good:#35C07A;
  --oops:#FF8A5B;
  --accent:var(--good);
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-latin:"Fredoka","Jua","Arial Rounded MT Bold",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{font-size:clamp(15px,calc(2.1vmin + 6px),22px)}
body{
  font-family:var(--f-body);color:var(--ink);
  background:
    radial-gradient(120% 60% at 15% 108%,var(--meadow) 0 55%,transparent 56%),
    radial-gradient(110% 55% at 85% 112%,#A5E0B4 0 55%,transparent 56%),
    linear-gradient(var(--sky),#F1FBFF 70%);
  background-color:var(--sky);
  overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;word-break:keep-all;
}
[data-world="ko"]{--accent:var(--ko)}
[data-world="en"]{--accent:var(--en)}
[data-world="ma"]{--accent:var(--ma)}
#app{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen{min-height:100%;max-width:920px;margin:0 auto;padding:18px 18px 24px;display:flex;flex-direction:column;gap:14px}
h1,h2,.d{font-family:var(--f-display);font-weight:400;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

.stk{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink)}
button.stk{transition:transform .08s,box-shadow .08s}
button.stk:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.pill{font-family:var(--f-display);padding:.5rem 1rem;border-radius:999px;font-size:1rem;min-height:48px;display:inline-flex;align-items:center;gap:.4rem}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}

/* 말랑이 */
.mas svg{display:block;width:100%;height:auto;overflow:visible}
.mas.idle svg{animation:bob 2.6s ease-in-out infinite}
.mas.happy svg{animation:hop .5s ease-out 2}
.mas.think svg{animation:tilt 1.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{50%{transform:translateY(-5px) scale(1.02,.98)}}
@keyframes hop{40%{transform:translateY(-16px) scale(.96,1.05)}}
@keyframes tilt{50%{transform:rotate(-5deg)}}
.bubble{position:relative;padding:.7rem 1rem;font-family:var(--f-display);font-size:1.05rem;line-height:1.35;border-radius:20px}
.bubble::before{content:"";position:absolute;left:-13px;bottom:18px;width:20px;height:20px;background:var(--paper);border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg);border-radius:0 0 0 5px}

/* 홈 */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hero{display:flex;align-items:flex-end;gap:14px}
.hero .mas{width:min(28vw,160px);flex:none}
.hero h1{font-size:2.1rem;line-height:1.1;margin-bottom:.5rem}
.hero h1 span{color:var(--ko)} .hero h1 span+span{color:var(--en)} .hero h1 span+span+span{color:#E79A00}
.grow{display:flex;align-items:center;gap:.7rem;padding:.55rem 1rem;font-size:.92rem}
.grow .bar{flex:1;height:14px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;min-width:60px}
.grow .bar i{display:block;height:100%;background:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:.7rem}
.chip{background:#FFE98A;font-size:1.05rem;min-height:46px}
.reset{font-size:.85rem;min-height:40px;opacity:.7;margin-top:.4rem}
.rs .card{background:var(--paper);max-width:24rem}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grades button{justify-content:center;font-size:1.15rem}
.grades button.on{background:var(--ink);color:var(--paper)}
.today{display:flex;align-items:center;gap:.8rem 1rem;padding:.8rem 1rem;flex-wrap:wrap;background:#FFF3B8}
.today .w{flex:1;min-width:11rem}
.today .w b{font-family:var(--f-display);font-weight:400;font-size:1.3rem;display:block}
.today .w span{font-size:.92rem}
.chk{display:flex;gap:6px}
.chk i{font-style:normal;font-family:var(--f-display);font-size:.9rem;border:3px solid var(--ink);border-radius:99px;padding:.1rem .6rem;background:#fff}
.chk i.ok{background:var(--accent)}
.worlds{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.wcard{padding:1rem .8rem .9rem;display:flex;flex-direction:column;align-items:center;gap:.3rem;text-align:center;background:var(--accent)}
.wcard .glyph{font-family:var(--f-latin);font-size:2.3rem;line-height:1;background:var(--paper);border:3px solid var(--ink);border-radius:50%;width:4.2rem;height:4.2rem;display:grid;place-items:center}
.wcard .glyph.k{font-family:var(--f-display)}
.wcard b{font-family:var(--f-display);font-weight:400;font-size:1.4rem}
.wcard small{font-size:.88rem}
.wcard .cnt{font-family:var(--f-display);background:var(--paper);border:3px solid var(--ink);border-radius:99px;padding:.1rem .8rem;font-size:.95rem}
@media (max-width:560px){.worlds{grid-template-columns:1fr}.wcard{flex-direction:row;text-align:left;gap:.9rem;padding:.7rem 1rem}.wcard .cnt{margin-left:auto}.hero h1{font-size:1.7rem}}

/* 단계 고르기 */
.levels{display:flex;flex-direction:column;gap:12px}
.lv{display:flex;align-items:center;gap:1rem;padding:.8rem 1.1rem;text-align:left;width:100%}
.lv .n{font-family:var(--f-latin);font-size:1.6rem;width:3.1rem;height:3.1rem;flex:none;border-radius:50%;background:var(--accent);border:3px solid var(--ink);display:grid;place-items:center}
.lv .t{flex:1;min-width:0}
.lv .t b{font-family:var(--f-display);font-weight:400;font-size:1.25rem;display:block}
.lv .t span{font-size:.9rem}
.lv.lock{opacity:.55;box-shadow:0 2px 0 var(--ink)}
.stars{font-size:1.5rem;letter-spacing:2px;color:#D8DEE8;white-space:nowrap;-webkit-text-stroke:1.5px var(--ink)}
.stars b{color:#FFD23F;font-weight:400}

/* 놀이 */
.play{gap:12px}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dots i{width:22px;height:14px;border:3px solid var(--ink);border-radius:99px;background:#fff}
.dots i.on{background:var(--accent)} .dots i.now{background:#FFE98A} .dots i.re{border-style:dashed}
.qcard{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;padding:1rem;text-align:center;min-height:11rem;border-top:14px solid var(--accent);border-radius:26px}
.qcard .ask{font-size:1rem}
.qcard .big{font-size:4.6rem;line-height:1.15}
.qcard .prompt{font-family:var(--f-display);font-size:3rem;line-height:1.25;display:flex;gap:.35rem;justify-content:center;align-items:center;flex-wrap:wrap}
.prompt.en,.prompt.num{font-family:var(--f-latin);font-weight:600}
.prompt.num{font-size:3.4rem;font-variant-numeric:tabular-nums}
.prompt.line{font-size:2rem;gap:.5rem}
.ch{display:inline-grid;place-items:center;min-width:1.25em;height:1.35em;padding:0 .12em}
.ch.blank{border:3px dashed var(--ink);border-radius:14px;background:#FFF3B8;color:var(--oops);padding:0 .3em}
.ch.blank.ok{border-style:solid;background:#CFF5DF;color:var(--ink)}
.objs{font-size:1.9rem;line-height:1.3;letter-spacing:.06em;max-width:100%;word-break:break-all}
.objs s{text-decoration:none;opacity:.28;position:relative}
.objs s::after{content:"";position:absolute;left:8%;right:8%;top:50%;border-top:4px solid var(--oops);transform:rotate(-35deg)}
.objs .op{font-family:var(--f-latin);margin:0 .3em}
.hintbox{display:none;padding:.7rem 1rem;background:#FFF3B8;border-radius:18px;font-size:1.05rem;line-height:1.45;text-align:center}
.hintbox.show{display:block;animation:pop .25s ease-out}
.hintbox b{font-family:var(--f-display);font-weight:400;font-size:1.15em;color:#C2410C}
@keyframes pop{from{transform:scale(.9);opacity:.3}}
.tf{display:flex;gap:5px;justify-content:center;margin:.25rem 0}
.tf .d{width:1.3rem;height:1.3rem;border-radius:50%;border:3px solid var(--ink);background:#fff;display:block}
.tf .d.gap{margin-right:.7rem}
.tf .d.a{background:var(--ko)} .tf .d.b{background:var(--en)}
.tf .d.x{background:#fff;position:relative;opacity:.6}
.tf .d.x::after{content:"";position:absolute;inset:-4px;background:linear-gradient(45deg,transparent 43%,var(--oops) 43% 57%,transparent 57%)}
.tf .d.q{border-style:dashed;background:#FFF3B8}
.opts{display:grid;gap:14px;grid-template-columns:repeat(var(--n,3),1fr)}
.opt,.tile{font-family:var(--f-display);font-size:2rem;min-height:4.2rem;padding:.4rem .6rem;border-radius:22px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s,opacity .2s}
.opt:active,.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.opt.en,.tile.en,.opt.num{font-family:var(--f-latin);font-weight:600}
.opt.num{font-size:2.4rem}
.opt.emoji{font-size:3.2rem}
.opt.sm{font-size:1.35rem;line-height:1.3}
.opt.good,.slot.fill{background:#CFF5DF}
.opt.good{animation:hop .45s ease-out}
.opt.off,.tile.used{opacity:.3;box-shadow:0 1px 0 var(--ink);transform:translateY(4px);pointer-events:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.slots,.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.slot{min-width:3.4rem;height:3.8rem;padding:0 .5rem;border:3px dashed var(--ink);border-radius:16px;background:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:2rem}
.slot.en{font-family:var(--f-latin);font-weight:600}
.slot.fill{border-style:solid}
.tile{min-width:4rem}
.tile.glow{background:#FFE98A;animation:bob 1s ease-in-out infinite}
@media (max-width:560px){.opts{grid-template-columns:repeat(2,1fr)}.qcard .big{font-size:3.6rem}.qcard .prompt{font-size:2.3rem}.prompt.line{font-size:1.6rem}}
.foot{display:flex;align-items:flex-end;gap:12px}
.foot .mas{width:5.2rem;flex:none}
.foot .bubble{flex:1;min-width:0;margin-bottom:.4rem}
.hintbtn{background:#FFE98A;font-size:1.15rem;min-height:56px;margin-bottom:.4rem;white-space:nowrap}

/* 결과 */
.result{align-items:center;text-align:center;justify-content:center}
.result .mas{width:min(36vw,180px)}
.result h2{font-size:2.2rem}
.bigstars{font-size:4.2rem;letter-spacing:.2rem}
.bigstars b{display:inline-block;animation:starin .5s cubic-bezier(.3,1.6,.5,1) backwards}
.bigstars b:nth-child(2){animation-delay:.25s}.bigstars b:nth-child(3){animation-delay:.5s}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.newstk{padding:.7rem 1.4rem;display:flex;align-items:center;gap:.8rem;font-family:var(--f-display);font-size:1.15rem;background:#FFF3B8}
.newstk span{font-size:2.8rem}.newstk .bun{width:3.6rem;flex:none}
.learned{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:680px}
.learned i{font-style:normal;font-family:var(--f-display);background:var(--paper);border:3px solid var(--ink);border-radius:99px;padding:.2rem .8rem;font-size:1rem}
.pill.go{background:var(--accent);font-size:1.2rem;min-height:58px;padding:.6rem 1.5rem}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-20px;width:12px;height:18px;border-radius:4px;border:2px solid var(--ink);animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* 토끼 친구 */
.bun svg{display:block;width:100%;height:auto;overflow:visible}
.buns{display:flex;align-items:center;gap:.8rem;padding:.5rem 1rem;width:100%;text-align:left}
.buns .rowb{display:flex;gap:2px;flex:1;min-width:0;overflow:hidden;align-items:flex-end;min-height:3.6rem}
.buns .rowb .bun{width:3.3rem;flex:none}
.buns .txt{font-family:var(--f-display);font-size:1rem;white-space:nowrap;text-align:right;line-height:1.45}
.sil svg{filter:brightness(0);opacity:.13}
.book{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.slotb{padding:.5rem .3rem .4rem;display:flex;flex-direction:column;align-items:center;gap:.1rem;font-family:var(--f-display);font-size:.9rem;position:relative;border-radius:22px;text-align:center}
.slotb .bun{width:78%}
.slotb.none{background:#EEF3F8;border-style:dashed;box-shadow:none;color:#7B8AA0}
.slotb.none::after{content:"?";position:absolute;top:34%;left:0;right:0;font-family:var(--f-latin);font-size:1.9rem;color:#7B8AA0}
.slotb.sel{background:#FFE98A}
.showcase{display:flex;align-items:center;gap:1rem;padding:.8rem 1.2rem;background:#FFF3B8}
.showcase .bun{width:min(30vw,150px);flex:none;animation:bob 2.4s ease-in-out infinite}
.showcase b{font-family:var(--f-display);font-weight:400;font-size:1.6rem;display:block}
@media (max-width:560px){.book{grid-template-columns:repeat(4,1fr)}}
.cheer{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(38vmin,250px);pointer-events:none;display:flex;flex-direction:column;align-items:center;z-index:5;animation:peek 1.6s ease-out forwards}
.cheer .pill{min-height:0;padding:.2rem .9rem;margin-bottom:-.2rem;z-index:1}
.cheer .bun{width:100%}
@keyframes peek{0%{transform:translate(-50%,100%)}18%{transform:translate(-50%,-6%)}30%{transform:translate(-50%,4%)}42%,82%{transform:translate(-50%,0)}100%{transform:translate(-50%,105%)}}
.reveal{position:fixed;inset:0;background:rgba(39,54,75,.55);display:grid;place-items:center;z-index:6;padding:18px}
.reveal .card{padding:1.2rem 1.6rem 1.4rem;display:flex;flex-direction:column;align-items:center;gap:.5rem;text-align:center;max-width:26rem;animation:pop .35s cubic-bezier(.3,1.5,.5,1);background:radial-gradient(circle at 50% 44%,#FFF3B8 0 36%,var(--paper) 37%)}
.reveal .bun{width:min(50vmin,230px);animation:hop .6s ease-out 3}
.reveal h2{font-size:1.9rem}
.reveal.zoom .card{max-width:none;padding:1rem 2rem 1.4rem}
.reveal.zoom .bun{width:min(72vmin,58vh,520px);animation:bob 2.4s ease-in-out infinite}
.reveal.zoom b{font-size:2rem}
.reveal b{font-family:var(--f-display);font-weight:400;font-size:1.5rem}
.bk .card{width:min(100%,30rem);align-items:stretch;background:var(--paper)}
.bk textarea{width:100%;height:9rem;border:3px solid var(--ink);border-radius:14px;padding:.6rem;font:13px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);background:#fff;resize:none;user-select:text;-webkit-user-select:text}
.bk p{font-size:.92rem;line-height:1.45;text-align:left}
.clock{width:min(44vmin,12.5rem)}
.clock svg{display:block;width:100%;height:auto}
.prompt.txt{font-family:var(--f-body);font-size:1.45rem;line-height:1.6;display:block;text-align:left;max-width:36rem}
.qcard .ask.q{font-family:var(--f-display);font-size:1.35rem;order:5;margin-top:.3rem}
.spk{background:#FFE98A;font-size:1.4rem;min-height:64px;padding:.6rem 1.6rem}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.shelf button{padding:0 0 .7rem;overflow:hidden;display:flex;flex-direction:column;gap:.2rem;text-align:center}
.shelf svg,.sc svg{display:block;width:100%;height:auto}
.shelf b{font-family:var(--f-display);font-weight:400;font-size:1.2rem;padding:.5rem .5rem 0}
.sc{overflow:hidden;width:min(100%,calc(46vh*1.6));align-self:center}
.sc svg *,.shelf svg *{transform-box:fill-box;transform-origin:center}
.a-bob{animation:sbob 2.6s ease-in-out infinite}
@keyframes sbob{50%{transform:translateY(-5px)}}
.a-tw{animation:stw 1.7s ease-in-out infinite}
@keyframes stw{50%{opacity:.25;transform:scale(.75)}}
.a-tw2{animation:stw2 2s ease-in-out infinite}
@keyframes stw2{50%{transform:scale(1.12) rotate(-6deg)}}
.a-fl{animation:sfl 3.2s ease-in-out infinite}
@keyframes sfl{50%{transform:translateY(-9px) rotate(4deg)}}
.a-drip{animation:sdrip 1.4s ease-in infinite}
@keyframes sdrip{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(10px);opacity:0}}
.a-rain{animation:srain .9s linear infinite}
@keyframes srain{0%{transform:translate(8px,-28px);opacity:0}25%,75%{opacity:1}100%{transform:translate(-8px,28px);opacity:0}}
.a-snow{animation:ssnow 5.5s linear infinite}
@keyframes ssnow{0%{transform:translate(0,-30px);opacity:0}15%,80%{opacity:1}50%{transform:translate(10px,45px)}100%{transform:translate(0,120px);opacity:0}}
.a-sun{animation:ssun 4s ease-in-out infinite}
@keyframes ssun{50%{transform:scale(1.1)}}
.a-bow{animation:sbow 1.6s ease-out backwards}
@keyframes sbow{from{opacity:0;transform:translateY(30px)}}
.a-page{animation:spage .45s ease-out}
@keyframes spage{from{opacity:.2;transform:translateX(18px)}}
.stext{padding:1rem 1.4rem;font-family:var(--f-display);font-size:1.32rem;line-height:1.65;text-align:center;text-wrap:pretty}
.moral{background:#FFF3B8;padding:.7rem 1.2rem;border-radius:18px;font-size:1.05rem;text-align:center}
@media (max-width:560px){.shelf{grid-template-columns:1fr}.stext{font-size:1.3rem}.prompt.txt{font-size:1.2rem}}
.padwrap{display:flex;justify-content:center}
.qcard.slim{flex:none;min-height:0;padding:.7rem 1rem}.qcard.slim .big{font-size:3rem}
#pad{touch-action:none;background:#fff;border-radius:22px;cursor:crosshair;display:block}

/* 다이어리 */
.cal{padding:.8rem;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{font-family:var(--f-display);text-align:center;font-size:.9rem;padding:.2rem 0}
.day{aspect-ratio:1/0.82;border:3px solid transparent;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-latin);font-size:1rem;gap:1px;background:#F3F7EF}
.day em{font-style:normal;font-size:1.25rem;line-height:1;min-height:1.25rem}
.day.has{background:#fff;border-color:var(--ink)}
.day.now{box-shadow:inset 0 0 0 3px var(--ma)}
.day.sel{background:#FFE98A;border-color:var(--ink)}
.page{padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.7rem}
.page h3{font-family:var(--f-display);font-weight:400;font-size:1.35rem}
.prow{display:flex;align-items:center;gap:.6rem;font-size:1rem;flex-wrap:wrap}
.prow .dot{width:1rem;height:1rem;border-radius:50%;border:3px solid var(--ink);background:var(--accent);flex:none}
.prow .stars{font-size:1.1rem;margin-left:auto}
.page .learned{justify-content:flex-start;max-width:none}
.moods button{font-size:1rem}
.moods button.on{background:var(--good)}
.note{font-size:.88rem;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ───────── 도구 ───────── */
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];

  const page=e?`<div class="row" style="justify-content:flex-start">${e.m?`<span class="pill stk">오늘 기분 ${e.m}</span>`:""}<span>별 ${e.p.reduce((a,p)=>a+p.s,0)}개 · ${e.p.length}단계</span></div>
      ${e.p.map(p=>`<div class="prow" data-world="${p.w}"><i class="dot"></i><span>${p.w==="rv"?"복습":`${p.g}학년 ${WORLD[p.w].sub}`}${p.t?" · "+p.t:""}</span>${starStr(p.s)}</div>`).join("")}
      ${e.l&&e.l.length?`<div class="learned">${e.l.map(x=>`<i>${x}</i>`).join("")}</div>`:""}
      ${sel===td?`<div class="row moods" style="justify-content:flex-start"><span class="d">오늘 공부 어땠어?</span>${[["😆","재밌었어"],["🙂","괜찮았어"],["😵","어려웠어"]].map(x=>`<button class="pill stk${e.m===x[0]?" on":""}" data-act="mood" data-v="${x[0]}">${x[0]} ${x[1]}</button>`).join("")}</div>`:""}`
    :`<p>${sel===td?"아직 오늘 공부를 안 했어요.":"이날은 쉬었어요."}</p>${sel===td?`<div><button class="pill stk go" data-act="quest">오늘의 공부 시작 →</button></div>`:""}`;
  show(`<div class="screen">
   <div class="top"><button class="pill stk" data-act="home">← 숲으로</button><h2 style="font-size:1.7rem">${ui()} 공부 다이어리</h2><span class="pill stk">공부한 날 ${allDays}일${streak()>1?` · 연속 ${streak()}일`:""}</span></div>
   <div class="row"><button class="pill stk" data-act="month" data-y="${py}" data-m="${pm}" aria-label="이전 달">‹</button><b class="d" style="font-size:1.4rem;min-width:9rem;text-align:center">${y}년 ${m+1}월</b><button class="pill stk" data-act="month" data-y="${ny}" data-m="${nm}" aria-label="다음 달">›</button></div>
   <div class="cal stk">${cells}</div>
   <div class="page stk"><h3>${sm}월 ${sd}일 ${WD[sdate.getDay()]}요일</h3>${page}</div>
   <div class="row"><button class="pill stk" data-act="backup">기록 백업 · 가져오기</button></div>
   <p class="note">💮 국어·영어·산수를 모두 한 날 &nbsp; ⭐ 한 가지 이상 한 날 &nbsp;·&nbsp; ${cloud?"기록이 내 계정에 저장돼요":"기록이 이 기기에 저장돼요"}</p>
  </div>`);
}

/* ───────── 놀이 ───────── */
const cur=()=>P.queue[P.i];
function start(w,i){const qs=GR[S.grade][w][i].gen();if(w==="ma"&&!GR[S.grade][w][i].nc)qs.splice(2+rnd(3),0,clockQ(S.grade));P={w,g:S.grade,i:0,lv:i,queue:qs,perfect:0,learned:[]};P.base=P.queue.length;showQ()}
function showQ(){
  const q=cur();q.wrong=0;q.hinted=false;q.stage=0;q.filled=0;P.lock=false;
  const dots=P.queue.map((x,k)=>`<i class="${k<P.i?"on":k===P.i?"now":""}${x.retry?" re":""}"></i>`).join("");
  const body=q.kind==="choice"
   ?`<div class="opts" style="--n:${q.cols||q.options.length}">${q.options.map((o,k)=>`<button class="opt ${q.cls}" data-act="opt" data-i="${k}">${o}</button>`).join("")}</div>`
   :q.kind==="write"?padHtml(q):`<div class="tiles">${q.tiles.map(t=>`<button class="tile ${q.cls}" data-act="tile" data-v="${t}">${t}</button>`).join("")}</div>`;
  show(`<div class="screen play">
   <div class="top"><button class="pill stk" data-act="world" data-w="${P.w}">← 그만하기</button><div class="dots">${dots}</div><button class="pill stk" data-act="say">🔊 듣기</button></div>
   <div class="qcard stk${q.kind==="write"?" slim":""}"><div class="ask${q.bigask?" q":""}">${q.retry?"한 번 더 해 볼까요? ":""}${q.ask}</div>
     ${q.listen?`<button class="pill stk spk" data-act="say">🔊 소리 듣기</button>${TTS&&S.sound?"":`<div class="prompt ${q.say[1]==="en-US"?"en":""}">${q.fb}</div>`}`:""}
     ${q.big?`<div class="big">${q.big}</div>`:""}${q.pic||""}
     ${q.visual?`<div class="objs">${q.visual}</div>`:""}
     ${q.prompt?`<div class="prompt ${q.pcls||""}" id="prompt">${q.prompt}</div>`:""}
     ${q.kind==="build"?`<div class="slots">${q.target.map(()=>`<span class="slot ${q.cls}"></span>`).join("")}</div>`:""}
   </div>
   <div class="hintbox stk" id="hintbox"></div>
   ${body}
   <div class="foot">${mas("idle")}<div class="bubble stk" id="bub">${q.retry?"아까 그 문제야. 이번엔 할 수 있어!":(q.kind==="write"?"천천히 따라 써 봐!":"잘 보고 골라 봐!")}</div><button class="pill stk hintbtn" data-act="hint">💡 힌트</button></div>
  </div>`,P.w);
  if(q.kind==="write")setupPad(q);
  if(q.listen)speak(q.say[0],q.say[1]);
}
function mood(m,text){const el=document.getElementById("mas");if(el){el.className="mas "+m;el.innerHTML=mallang(m)}const b=document.getElementById("bub");if(b&&text)b.textContent=text}
function correct(){
  const q=cur();P.lock=true;
  if(!q.retry){P.learned.push(q.learn);if(P.rv)markReview(q);else if(q.wrong>0)addWrong(q);if(q.wrong===0&&!q.hinted)P.perfect++;else if(q.wrong>0)P.queue.push(Object.assign({},q,{retry:true}))}
  sfx("ok");mood("happy",praise());
  const p=document.getElementById("prompt");if(p&&q.done)p.innerHTML=q.done;
  if(q.after)speak(q.after,q.say[1]);
  const got=carrot();
  const run=P;
  if(got!=null)setTimeout(()=>{if(P===run)reveal(got)},900);
  else{app.insertAdjacentHTML("beforeend",`<div class="cheer"><span class="pill stk">${S.bun.length<BUNS.length?`🥕 ${S.car}/${cost()}`:"🥕 +1"}</span>${bun(pick(S.bun))}</div>`);setTimeout(()=>{if(P===run)advance()},1700)}
}
function advance(){if(!P)return;P.i++;P.i>=P.queue.length?finish():showQ()}
function reveal(id){
  sfx("win");const conf=Array.from({length:22},()=>`<i style="left:${rnd(100)}%;background:${pick(["#FF7FA3","#4AA8F0","#FFB627","#35C07A","#FFE98A"])};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.6}s"></i>`).join("");
  app.insertAdjacentHTML("beforeend",`<div class="reveal"><div class="conf">${conf}</div><div class="card stk"><h2>${ui()} 새 친구 발견!</h2>${bun(id)}<b>${BUNS[id].n}</b><span>${BUNS[id].d}</span>
    <span>토끼 친구 ${S.bun.length}/${BUNS.length}</span><button class="pill stk go" data-act="got">도감에 넣기 →</button></div></div>`);
}
function wrong(btn){
  const q=cur();q.wrong++;sfx("no");btn.classList.add("shake");setTimeout(()=>btn.classList.remove("shake"),400);
  mood("think",oops());if(q.wrong===2&&q.stage===0)setTimeout(()=>{if(P&&cur()===q&&!P.lock)hint()},500);
}
function hint(){
  const q=cur();if(P.lock)return;q.hinted=true;sfx("tap");
  if(q.stage===0){q.stage=1;const h=document.getElementById("hintbox");h.innerHTML=q.hint;h.classList.add("show");speak(q.say[0],q.say[1]);mood("think","힌트를 줄게! 한 번 더 누르면 더 쉬워져.");return}
  if(q.kind==="choice"){
    const w=[...document.querySelectorAll(".opt:not(.off)")].filter(b=>+b.dataset.i!==q.answer);
    if(w.length>1){pick(w).classList.add("off");mood("think","하나를 지웠어. 남은 것 중에서 골라 봐!")}else mood("think","이제 둘 중 하나야. 할 수 있어!");
  }else if(q.kind==="write"){PAD.dark=true;PAD.base();mood("think","글자를 더 진하게 보여 줄게!")
  }else{
    const t=[...document.querySelectorAll(".tile:not(.used)")].find(b=>b.dataset.v===q.target[q.filled]);
    if(t){t.classList.add("glow");mood("think","반짝이는 것을 눌러 봐!")}
  }
}
function finish(){
  if(P.rv)return finishReview();
  const {w,g}=P,i=P.lv,lv=GR[g][w][i],id=lid(g,w,i);
  const stars=P.perfect>=P.base-1?3:P.perfect>=P.base/2?2:1;
  S.stars[id]=Math.max(S.stars[id]||0,stars);
  const k=today(),e=S.diary[k]=S.diary[k]||{p:[],l:[],m:""};
  e.p.push({g,w,k:lv.k,t:lv.title,s:stars});e.l=[...new Set([...e.l,...P.learned])].slice(-48);
  save();sfx("win");
  const hasNext=i+1<GR[g][w].length,learned=P.learned,left=WS.filter(x=>!doneToday(x));P=null;
  const conf=Array.from({length:26},()=>`<i style="left:${rnd(100)}%;background:${pick(["#FF7FA3","#4AA8F0","#FFB627","#35C07A","#FFE98A"])};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.8}s"></i>`).join("");
  show(`<div class="conf">${conf}</div><div class="screen result">
   ${mas("happy")}
   <h2>${ya()}, ${["","끝까지 해냈어!","참 잘했어!","완벽해! 최고야!"][stars]}</h2>
   <div class="stars bigstars">${"<b>★</b>".repeat(stars)}${"★".repeat(3-stars)}</div>
   ${S.bun.length?`<div class="newstk stk">${bun(S.bun[S.bun.length-1])}<span style="font-size:1.1rem">토끼 친구 ${S.bun.length}/${BUNS.length}${S.bun.length<BUNS.length?` · 다음 친구까지 🥕 ${S.car}/${cost()}`:""}</span></div>`:""}
   ${left.length?"":`<div class="newstk stk"><span>💮</span>오늘의 공부 끝! 다이어리에 도장 쾅!</div>`}
   <div><p style="margin-bottom:.5rem">오늘 익힌 것 · ${lv.goal}</p><div class="learned">${learned.map(x=>`<i>${x}</i>`).join("")}</div></div>
   <div class="row">${left.length?`<button class="pill stk go" data-act="quest">오늘의 공부 이어서: ${WORLD[left[0]].sub} →</button>`:`<button class="pill stk go" data-act="diary">📔 다이어리 보기</button>`}
     ${hasNext?`<button class="pill stk" data-act="start" data-w="${w}" data-i="${i+1}">다음 단계</button>`:""}
     <button class="pill stk" data-act="start" data-w="${w}" data-i="${i}">${stars<3?"별 3개 도전!":"다시 하기"}</button>
     <button class="pill stk" data-act="home">숲으로</button></div>
  </div>`,w);
}

/* ───────── 입력 ───────── */
app.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,d=b.dataset;
  if(a==="home"){sfx("tap");home()}
  else if(a==="world"){sfx("tap");d.w==="rv"?home():world(d.w)}
  else if(a==="review"){sfx("tap");startReview()}
  else if(a==="stories"){sfx("tap");try{speechSynthesis.cancel()}catch(e){}stories()}
  else if(a==="story"){sfx("tap");story(+d.s,+d.p);tell(STORIES[+d.s].p[+d.p][2])}
  else if(a==="reread"){tell(document.getElementById("stx").textContent)}
  else if(a==="book"){sfx("tap");book()}
  else if(a==="bun"){sfx("tap");book(+d.i);zoom(+d.i)}
  else if(a==="close"){const z=document.querySelector(".zoom,.bk,.rs");if(z)z.remove()}
  else if(a==="backup"){sfx("tap");backup()}
  else if(a==="reset"){sfx("tap");askReset()}
  else if(a==="resetok"){const keep={sound:S.sound,name:S.name};S=Object.assign(fresh(),keep);save();sfx("tap");home()}
  else if(a==="go"){sfx("tap");const g=d.go;
    if(g.startsWith("chat:")){home(g.slice(5));tell(document.getElementById("bub").textContent)}
    else if(g.startsWith("world:"))world(g.slice(6));
    else if(g==="book")book();
    else if(g==="stories")stories();
    else if(g==="review")startReview();
    else{const w=WS.find(x=>!doneToday(x));w?start(w,quest(w)):diary()}}
  else if(a==="bkcopy"){const t=document.getElementById("bk"),m=document.getElementById("bkmsg");t.focus();t.select();try{t.setSelectionRange(0,t.value.length)}catch(e){}
    const ok=()=>{m.textContent="복사했어요. 메모 앱에 붙여 넣어 보관하세요."},no=()=>{m.textContent="자동 복사가 안 돼요. 칸을 길게 눌러 ‘전체 선택 → 복사’를 해 주세요."};
    try{navigator.clipboard.writeText(t.value).then(ok,no)}catch(e){no()}}
  else if(a==="bkload"){const m=document.getElementById("bkmsg");try{const j=JSON.parse(document.getElementById("bk").value);if(!j||typeof j.stars!=="object"||!j.stars)throw 0;
      S=fresh();adopt(j);save();sfx("ok");home()}
    catch(e){m.textContent="가져올 수 없는 글자예요. 백업한 글자를 빠짐없이 붙여 넣었는지 확인해 주세요."}}
  else if(a==="got"){sfx("tap");advance()}
  else if(a==="diary"){sfx("tap");diary()}
  else if(a==="month"){sfx("tap");diary(+d.y,+d.m,today())}
  else if(a==="day"){sfx("tap");const [y,m]=d.k.split("-").map(Number);diary(y,m-1,d.k)}
  else if(a==="mood"){const e=S.diary[today()];if(e){e.m=d.v;save();sfx("ok");diary()}}
  else if(a==="grade"){S.grade=+d.g;save();sfx("tap");home()}
  else if(a==="quest"){sfx("tap");const w=WS.find(x=>!doneToday(x));w?start(w,quest(w)):diary()}
  else if(a==="sound"){S.sound=!S.sound;save();sfx("tap");home()}
  else if(a==="start"){sfx("tap");start(d.w,+d.i)}
  else if(!P||P.lock)return;
  else if(a==="say"){const q=cur();speak(q.say[0],q.say[1])}
  else if(a==="hint")hint();
  else if(a==="clr"){if(PAD){PAD.u.clearRect(0,0,PAD.W,PAD.H);PAD.drawn=false;PAD.base();sfx("tap")}}
  else if(a==="chk"){if(!PAD)return;const r=checkPad();
    if(r.un<40){mood("think","먼저 회색 글자를 따라 써 봐!");return}
    if(r.cov>=.6&&r.spill<=.35)correct();
    else{wrong(b);mood("think",r.spill>.35?"선 밖으로 많이 나갔어. 지우고 다시 써 보자!":"조금만 더! 회색 글자를 끝까지 채워 봐.")}}
  else if(a==="opt"){const q=cur();if(+d.i===q.answer){b.classList.add("good");correct()}else{wrong(b);setTimeout(()=>b.classList.add("off"),380)}}
  else if(a==="tile"){const q=cur();
    if(d.v===q.target[q.filled]){b.classList.remove("glow");b.classList.add("used");const s=document.querySelectorAll(".slot")[q.filled];s.textContent=d.v;s.classList.add("fill");q.filled++;
      if(q.filled===q.target.length)correct();else sfx("tap")}
    else wrong(b)}
});

function boot(d){load(d);home();initCloud()}
try{if("serviceWorker" in navigator&&!window.claude&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
</body>
</html>
